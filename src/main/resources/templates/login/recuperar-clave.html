<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8"/>
  <title>Recuperar contraseña - SGIL</title>
  <link rel="stylesheet" th:href="@{/css/login.css}"/>
</head>
<body>
  <div class="login-layout">
    <section class="login-panel">
      <div class="login-card">
        <h2>Recuperar contraseña</h2>
        <p>Ingresa tu usuario o correo registrado. Si existe, te enviaremos un enlace para restablecer tu contraseña.</p>

        <div th:if="${mensaje}" class="info-msg" th:text="${mensaje}"></div>

        <form method="post" th:action="@{/recuperar-clave}">
          <label>Usuario o correo</label>
          <input type="text" name="identificador" required/>
          <button type="submit">Enviar enlace</button>
        </form>

        <p><a th:href="@{/login}">Volver al inicio de sesión</a></p>
      </div>
    </section>
  </div>
</body>
</html>
